# ci.yml skips docs-only pushes and pull requests (paths-ignore: docs/**, **.md), and those are the changes most
# likely to break a link. This runs only the link check on them. Code changes run it in ci.yml's unit tests.
name: Docs links

on:
  pull_request:
    paths:
      - 'docs/**'
      - '**.md'
  push:
    branches: ['**']
    paths:
      - 'docs/**'
      - '**.md'

jobs:
  docs-links:
    runs-on: ubuntu-latest
    name: Markdown links resolve
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm install

      - name: Check relative Markdown links
        run: npx vitest run tests/docs-links.test.ts
