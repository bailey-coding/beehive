# Docs-only pull requests skip ci.yml (paths-ignore: docs/**, **.md), and they are the ones most likely to break
# a link. This runs only the link check on them. Pushes already run it through ci.yml's unit tests.
name: Docs links

on:
  pull_request:
    paths:
      - 'docs/**'
      - '**.md'

jobs:
  docs-links:
    runs-on: ubuntu-latest
    name: Markdown links resolve
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm install

      - name: Check relative Markdown links
        run: npx vitest run tests/docs-links.test.ts
