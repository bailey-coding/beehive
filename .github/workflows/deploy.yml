name: Deploy Workers

on:
  push:
    branches: [main]

# Environment variables available to all jobs and steps
env:
  NODE_VERSION: '22'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm install
      
      - name: Install worker dependencies (scientist-comparator)
        working-directory: workers/scientist-comparator
        run: npm install
      
      - name: Install worker dependencies (preview-manager)
        working-directory: workers/preview-manager
        run: npm install
      
      - name: Install worker dependencies (candidate-service)
        working-directory: workers/candidate-service
        run: npm install

      - name: Install worker dependencies (canary-worker)
        working-directory: workers/canary-worker
        run: npm install
      
      - name: Install worker dependencies (promotion-worker)
        working-directory: workers/promotion-worker
        run: npm install

      - name: Install worker dependencies (gate-workflow)
        working-directory: workers/gate-workflow
        run: npm install

      - name: Install worker dependencies (queue-consumer)
        working-directory: workers/queue-consumer
        run: npm install

      # Create queues required by M3 workers (must exist before consumer deployment)
      - name: Create canary-rollback-triggers queue
        run: npx wrangler queues create canary-rollback-triggers || true

      - name: Create promotion-events queue
        run: npx wrangler queues create promotion-events || true

      # Deploy main beehive worker (API + Spec DO) - must deploy first as others depend on it
      - name: Deploy beehive (main API + Spec DO)
        run: npm run deploy

      # Deploy gate workflow worker
      - name: Deploy beehive-gate-workflow
        run: npm run deploy:gate

      # Deploy queue consumer worker
      - name: Deploy beehive-queue-consumer
        run: npm run deploy:queue

      # Deploy sandbox runner worker
      - name: Deploy beehive-sandbox-runner
        run: npm run deploy:sandbox

      # Deploy shadow router worker
      - name: Deploy beehive-shadow-router
        run: npm run deploy:shadow

      # Deploy canary worker
      - name: Deploy beehive-canary-worker
        run: npm run deploy:canary

      # Deploy promotion worker
      - name: Deploy beehive-promotion-worker
        run: npm run deploy:promotion

      # Deploy scientist comparator worker
      - name: Deploy beehive-scientist-comparator
        run: npm run deploy:scientist

      # Deploy preview manager worker
      - name: Deploy beehive-preview-manager
        run: npm run deploy:preview

      # Deploy candidate service worker
      - name: Deploy beehive-candidate-service
        run: npm run deploy:candidate
