# Beehive Canary Worker
# Handles canary deployments with SLO monitoring and auto-rollback

name = "beehive-canary-worker"
main = "index.ts"
compatibility_date = "2026-10-09"

# Cloudflare account ID
[vars]
CANARY_SLO_LATENCY_P95 = "1000"  # 1 second
CANARY_SLO_ERROR_RATE = "0.01"   # 1%
# SLO loop (docs/M3-CANARY-SLO-PLAN.md): verdicts need this many samples in the window; source is "shadow"
# (mirrored traffic) until real canary traffic exists
CANARY_SLO_MIN_REQUESTS = "50"
CANARY_SLO_WINDOW_MINUTES = "15"
CANARY_SLO_SOURCE = "shadow"

# One SLO pass per minute over every live canary (rolls back violators with auto-rollback on)
[triggers]
crons = ["* * * * *"]

# Durable Object binding for Spec DO (cross-script)
[[durable_objects.bindings]]
name = "SPEC_DO"
class_name = "SpecDO"
script_name = "beehive"

# Service binding to Preview Manager
[[services]]
binding = "PREVIEW_MANAGER"
service = "beehive-preview-manager"

# Analytics Engine for SLO metrics
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "beehive-metrics"

# Queue for rollback triggers
[[queues.consumers]]
queue = "canary-rollback-triggers"
max_batch_size = 100
max_batch_timeout = 30

# SLO ticks from the Spec DO alarm (docs/M3-CANARY-SLO-PLAN.md); the cron above stays as a fallback
[[queues.consumers]]
queue = "canary-slo-ticks"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 0

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
destinations = ["honeycomb-traces"]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true
