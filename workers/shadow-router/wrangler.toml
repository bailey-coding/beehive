# Beehive Shadow Router Worker
# Mirrors production traffic to candidate Workers for Scientist comparison
# Discards all candidate responses - comparison is async via Scientist

name = "beehive-shadow-router"
main = "index.ts"
compatibility_date = "2026-10-09"
# fetch() to another Worker's workers.dev URL on this account is blocked by default (error 1042, answered as a 404), which
# made every mirrored candidate request a silent no-op. This flag sends such fetches over the public Internet instead
# (verified with a probe worker, docs/OPEN-QUESTIONS.md). Candidate requests carry no credentials (candidate-headers.ts).
compatibility_flags = ["global_fetch_strictly_public"]

# Cloudflare Artifacts configuration
[vars]
# Only canary targets on this account's workers.dev subdomain are mirrored to (shared/deploy-refs.ts isAcceptableCanaryUrl)
WORKERS_SUBDOMAIN = "bz23711"
# What a mirrored request may carry to a candidate (mirror-mode.ts): "none" (default: method, route template, Accept only),
# "redacted" (JSON body with string/number leaves replaced), or "full". "full" also needs GOVERNANCE_EGRESS_CONTROLLED = "true",
# a human-set var (docs/M5A-2-GOVERNANCE-PLAN.md Rev 5); without it the router falls back to "none".
MIRROR_BODY_MODE = "none"
# Route words kept in mirrored paths and in persisted paths (mirror-mode.ts routeTemplate); every other path segment becomes ":id".
# Add the mirrored service's own route names; usernames, slugs and ids must never be listed.
MIRROR_ROUTE_WORDS = "organizations,actors,repositories,specs,candidates,gate-verdicts,trials,promotions,issues,entities,history,stage,claim,decide,comments,app,about,roadmap"

# Durable Object binding for Spec DO (cross-script): the canary deploy refs
# (traffic pointer) are read from it on every mirrored request
[[durable_objects.bindings]]
name = "SPEC_DO"
class_name = "SpecDO"
script_name = "beehive"

# Analytics Engine for per-candidate metrics
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "beehive-metrics"

# Queue for sending comparison requests to Scientist Comparator
[[queues.producers]]
binding = "SCIENTIST_QUEUE"
queue = "beehive-scientist-comparisons"

[[queues.producers]]
binding = "PREVIEW_SCIENTIST_QUEUE"
queue = "preview-scientist-comparisons"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
destinations = ["honeycomb-traces"]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true
