# Beehive Sandbox Runner Worker
# Binds to the Spec DO hosted by the "beehive" (API) worker via script_name.

name = "beehive-sandbox-runner"
main = "index.ts"
compatibility_date = "2026-10-09"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Artifacts configuration
# Set CLOUDFLARE_API_TOKEN as a secret: wrangler secret put CLOUDFLARE_API_TOKEN
[vars]

[[durable_objects.bindings]]
name = "SPEC_DO"
class_name = "SpecDO"
script_name = "beehive"

# Build sandbox (Sandbox SDK 0.x, docs/SANDBOX-BUILD-PLAN.md). The Dockerfile image is built by Workers Builds'
# `wrangler deploy` (the U1 test of docs/OPEN-QUESTIONS.md "Sandbox build spike"); the base image tag must match
# the @cloudflare/sandbox version in package.json. No instance runs until a request starts one.
[[containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "lite"
max_instances = 2

[[durable_objects.bindings]]
name = "SANDBOX"
class_name = "Sandbox"

[[migrations]]
new_sqlite_classes = ["Sandbox"]
tag = "v1"

# Analytics Engine for per-candidate metrics
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "beehive-metrics"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
destinations = ["honeycomb-traces"]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true
